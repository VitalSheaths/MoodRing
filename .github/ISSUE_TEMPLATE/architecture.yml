name: Architecture Change
description: Propose a change to MoodRing's data, model, paper-trading, or service architecture.
labels: ["architecture"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Architectural objective
      description: |
        What user, research, or paper-trading capability should this change enable?
        State the property that must remain true before and after the change.
      placeholder: "e.g., Every paper-trading decision must be reproducible from the timestamped prediction and quote data used at decision time."
    validations:
      required: true

  - type: textarea
    id: current_design
    attributes:
      label: Current architecture
      description: |
        Describe the relevant data sources, pipelines, services, models, storage, state transitions,
        and current constraints. Explain what is difficult or insufficient today.
    validations:
      required: true

  - type: textarea
    id: data_flow
    attributes:
      label: Data and decision flow
      description: |
        Trace the proposed flow from ingestion through features, prediction, decision gates,
        paper execution, persistence, and monitoring. Include timestamps, ownership, and
        boundaries between PostgreSQL, SQLite, APIs, and in-memory model state where relevant.
      placeholder: |
        Source -> Bronze/Silver/Gold -> features -> model prediction -> risk gates -> paper trade -> ledger
    validations:
      required: true

  - type: textarea
    id: proposed_design
    attributes:
      label: Proposed architecture
      description: |
        Describe the concrete modules, tables, API routes, model interfaces, configuration,
        state transitions, and ownership changes. Specify what is added, removed, or reoriented.
        Include compatibility and migration requirements.
    validations:
      required: true

  - type: textarea
    id: risk_and_constraints
    attributes:
      label: Risk, data integrity, and constraints
      description: |
        Explain how the change preserves timestamp alignment, prevents look-ahead leakage,
        handles stale or missing market data, protects scenario isolation, and keeps paper
        trading simulation-only. Identify constraints that must be enforced.
    validations:
      required: false

  - type: textarea
    id: interfaces
    attributes:
      label: Interfaces and observability
      description: |
        List changed API contracts, schemas, configuration variables, experiment metadata,
        logs, metrics, and failure responses. State which failures are eliminated or introduced.
    validations:
      required: false

  - type: textarea
    id: affected
    attributes:
      label: Affected files
      description: List files or directories in dependency order and describe the expected change in each.
      placeholder: |
        - src/paper_trading/service.py - ...
        - src/features/... - ...
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: |
        Describe unit tests, integration tests, backtest comparisons, data-quality checks,
        model metrics, and paper-trading scenarios that should demonstrate correctness.
    validations:
      required: false

