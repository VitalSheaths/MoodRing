name: Bug Report
description: Report incorrect behavior in MoodRing's data, model, paper-trading, or API workflows.
labels: ["bug"]

body:
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: |
        What should the system do? State the expected property or result precisely.
      placeholder: "e.g., A stale quote must prevent a new paper trade and return a clear error."
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: |
        What actually happened? Include the data, prediction, quote, state transition,
        API response, metric, or persisted record that demonstrates the problem.
      placeholder: |
        1. Initial state or input: ...
        2. Pipeline, model, route, or transition: ...
        3. Incorrect output or persisted state: ...
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected subsystem
      options:
        - Data ingestion or timestamp alignment
        - Feature engineering or sentiment
        - Model training, inference, or calibration
        - Decision engine or risk gates
        - Paper-trading ledger or accounting
        - Backtesting or experiment evaluation
        - API, authentication, or storage
        - Monitoring or configuration
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: |
        Provide the smallest reproducible command, request, dataset, ticker, scenario,
        or sequence of events. Include relevant dates and environment details.
      placeholder: |
        1. Run: ...
        2. Send request or input: ...
        3. Observe: ...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact and failure class
      description: |
        Describe the impact on data integrity, leakage prevention, model validity,
        scenario isolation, accounting, paper-trading safety, or API availability.
      placeholder: "Correctness: the saved backtest result differs from the chronological replay."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Data and run context
      description: |
        Include model version, dataset or feature version, ticker(s), scenario or backtest ID,
        prediction and feature timestamps, quote timestamps, operating system, and Python version
        when available. Do not include credentials or other secrets.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs, traces, or validation output
      render: text
    validations:
      required: false

  - type: textarea
    id: suspected_cause
    attributes:
      label: Suspected cause or missing constraint
      description: |
        If known, identify the module, boundary, assumption, or missing validation
        that permits the failure. Otherwise leave this blank.
    validations:
      required: false