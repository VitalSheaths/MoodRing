name: Paper trading checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MoodRing/GloVe
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAPER_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MoodRing/GloVe/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_sec_access.py tests/test_sec_transport.py
      - run: python -m pytest -q
      - run: PYTHONPATH=src python -B examples/sec_metadata.py --offline-demo
      - run: PYTHONPATH=src python examples/api_smoke.py --self-contained
      - run: PYTHONPATH=src python examples/paper_demo.py
      - run: PYTHONPATH=src python examples/synthetic_market_demo.py
      - run: PYTHONPATH=src python examples/measure_synthetic_capacity.py --ack-disposable --output resources/capacity-report.json
  research-torch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MoodRing/GloVe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-research.txt
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=src:tests python -m unittest test_master_model test_forecast_master test_positive_master_experiments
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '2'
