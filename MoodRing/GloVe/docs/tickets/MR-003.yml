id: MR-003
type: defect
priority: P1
status: closed
title: Account for every backtest input signal
invariant: Each replay input has exactly one terminal outcome; unfilled equals all non-traded outcomes.
current: Indirect pending/index counts excluded some rejected signals and did not explain outcomes.
proposed: Persist input-indexed outcomes and status counts; distinguish expiry, existing position, PASS,
  rejected, no later event and future input.
acceptance:
- Outcome counts sum to input count.
- Traded count equals persisted trades; next-event fills and open positions are retained.
